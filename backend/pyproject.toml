[project]
name = "floci-studio-backend"
version = "0.1.0"
description = "Floci Studio backend: FastAPI gateway for the Floci emulator and the recipe Marketplace"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.48.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.0.0",
    "docker>=7.1.0",
    "boto3>=1.43.14",
    "aiofiles>=25.1.0",
    "asyncpg>=0.31.0",
    "faker>=40.19.1",
    "pyjwt>=2.13.0",
]
