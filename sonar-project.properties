sonar.projectKey=floci-studio
sonar.projectName=Floci Studio
sonar.projectVersion=0.1.0

# Sources
sonar.sources=src,backend/floci_backend
sonar.tests=tests,.playwright-mcp

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/__pycache__/**,**/backend/.venv/**

# TypeScript / JavaScript
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Python
sonar.python.version=3.10

# Coverage
sonar.coverage.exclusions=**/tests/**,**/*.test.ts,**/*.spec.ts,**/playwright-mcp/**

# Encoding
sonar.sourceEncoding=UTF-8
